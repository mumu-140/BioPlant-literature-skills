      category_ids:
        - cell-development-signaling
        - microbe-immunity
        - plant-biology

  notes:
  - Assign exactly one category per paper.
  - Send ambiguous but relevant papers to `other` instead of inventing new buckets.
  - Prefer plant-specific categories only when the paper is truly plant-centered.
  - Treat Briefing items with the same relevance rules as ordinary papers.
  - Exclude high-confidence clinical disease, treatment, prognosis, or patient-outcome studies; retain fundamental molecular biology and transferable resources.
  - Keep method, tool, model, dataset, or resource papers involving human or mouse systems when their approach can generalize to plant biology.
  - Use Zotero collection density, tags, and topic co-occurrence as offline optimization evidence; do not require Zotero access during daily filtering.
  - The manual title reject fragments above are a temporary curation layer for confirmed non-interest topics from recent review; revisit them when the preference set changes.

