# 公开示例：Google Basic v2 为主，腾讯云 TMT 为兜底。
# 真实 API Key / Secret 只应存在于 `local/.env.local`。

provider: google-basic-v2
glossary_path: ${SKILL_DIR}/config/content/bio_translation_glossary.yaml
fallback_provider: tencent-tmt

google_basic_v2:
  endpoint: https://translation.googleapis.com/language/translate/v2
  api_key_env: GOOGLE_TRANSLATE_API_KEY
  source_lang: en
  target_lang: zh-CN
  timeout_seconds: 20
  min_interval_seconds: 0.1
  max_retries: 5
  retry_backoff_seconds: 0.8
  model: nmt
  format: text

tencent_tmt:
  endpoint: https://tmt.tencentcloudapi.com/
  host: tmt.tencentcloudapi.com
  service: tmt
  action: TextTranslate
  version: 2018-03-21
  region: ap-beijing
  project_id: 0
  source_lang: en
  target_lang: zh
  timeout_seconds: 20
  min_interval_seconds: 0.25
  max_retries: 5
  retry_backoff_seconds: 0.8
  secret_id_env: TENCENT_TMT_SECRET_ID
  secret_key_env: TENCENT_TMT_SECRET_KEY
  token_env: ""

summary:
  mode: translated-abstract
  prefix_template: ""
  fallback_without_abstract: "未抓取到可用摘要，建议后续人工补充中文总结。"

notes:
  - Google Cloud Translation Basic v2 可直接使用 API Key。
  - 如果要用 Google Advanced v3 glossary，需要 ADC 或服务账号，单独 API Key 不够。
  - 腾讯云 TMT 在这个模板里只是兜底 provider，不建议与主通道并行混用。
