# 公开示例：复制到 `local/integrations/users.yaml` 后再维护真实用户。
# 这里的名字、邮箱、UID 全部是占位信息，不应替换为公开仓库中的真实收件人名单。

users:
  - uid: UDI-0001
    email: member@example.com
    name: 示例成员
    role: member
    group: internal
    is_active: true
    receives_digest: true
    smtp_profile: primary_smtp
    tags:
      - biology
      - reviewer

  - uid: UDI-0002
    email: admin@example.com
    name: 示例管理员
    role: admin
    group: internal
    is_active: true
    receives_digest: true
    smtp_profile: primary_smtp

notes:
  - "users 是邮件收件人配置的单一来源，与 API 登录账户分离。"
  - "SMTP 凭证只放在 local/integrations/email_config.yaml 和 local/.env.local。"
  - "group 会映射到 web 侧的 user_group，常见值是 internal 或 outsider。"
