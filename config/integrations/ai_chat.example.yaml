# 公开示例：OpenAI-compatible AI 翻译/复核配置。
# 复制到 `local/integrations/nvidia_ai.yaml`（文件名保留兼容）后再填真实值。
# 真实 API Key 优先放 `local/.env.local`；如果你只在本机私有 YAML 里写 api_key，也不要提交 local/。
# 注：此文件原名 nvidia_ai.example.yaml，已重命名为 ai_chat.example.yaml 以反映通用性。

provider: nvidia-chat
fallback_provider: tencent-tmt
fallback_config_path: ${SKILL_DIR}/local/integrations/translation_tencent_tmt.yaml
glossary_path: ${SKILL_DIR}/config/content/bio_translation_glossary.yaml

# 通用 OpenAI-compatible chat 配置；不绑定 NVIDIA。
# 兼容 9router、NewAPI、LiteLLM、OpenAI-compatible gateway、NVIDIA NIM/API Catalog 等。
ai_chat:
  base_url: http://127.0.0.1:20128/v1
  # 实际模型名以当前网关 `/v1/models` 或供应商文档为准。
  # 每次运行前会按 model_candidates 顺序做轻量 pong 测试，选择第一个可用模型。
  model: minimaxai/minimax-m2.7
  model_candidates:
    - minimaxai/minimax-m2.7
    - deepseek-ai/deepseek-v4-pro
    - z-ai/glm-5.1
    - minimaxai/minimax-m3
    - deepseek-ai/deepseek-v4-flash
  pong_test:
    enabled: true
    prompt: "Reply with exactly: pong"
    expected: "pong"
    max_tokens: 64
  # 推荐使用 api_key_envs；如果必须在私有 local YAML 里直填，也支持 api_key。
  api_key: ""
  api_key_envs:
    - AI_API_KEY
    - OPENAI_API_KEY
    - NVIDIA_API_KEY
    - NGC_API_KEY
  timeout_seconds: 60
  max_retries: 10
  retry_backoff_seconds: 1.0
  retry_max_sleep_seconds: 20.0
  temperature: 0.0
  max_output_tokens: 4096
  max_batch_items: 4
  max_batch_chars: 12000

daily_optimization:
  model: deepseek-ai/deepseek-v4-pro
  model_candidates:
    - deepseek-ai/deepseek-v4-pro
    - minimaxai/minimax-m2.7
    - z-ai/glm-5.1
    - minimaxai/minimax-m3
    - deepseek-ai/deepseek-v4-flash
  max_retries: 10
  retry_backoff_seconds: 1.0
  retry_max_sleep_seconds: 20.0
  max_selected_rows: 8

runtime:
  continue_on_error: true
  checkpoint_every_records: 1

summary:
  mode: ai-batch-title-summary
  fallback_without_abstract: "未抓取到可用摘要，建议后续人工补充中文总结。"

notes:
  - "`ai_chat.base_url` 是 OpenAI-compatible `/v1` 根路径，不要写到 `/chat/completions`。"
  - "`ai_chat.model_candidates` 按优先级填写；模型名必须和网关实际名称一致。"
  - "翻译/复核默认优先 `minimaxai/minimax-m2.7`；每日优化默认优先 `deepseek-ai/deepseek-v4-pro`。"
  - "每日运行会用 `pong_test` 先探测模型，选择第一个返回 `pong` 的候选。"
  - "API key 解析顺序：先读 `ai_chat.api_key`，再按 `api_key_envs` 从环境变量读取。"
  - "本 provider 是优先增强层；失败时回退到 Tencent TMT，避免产出英文 placeholder。"
  - "`provider: nvidia-chat` 作为现有 CLI 兼容名保留；实际后端由 `ai_chat` 配置决定。"
  - "旧字段 `nvidia_chat:` 仍兼容，但新配置优先用 `ai_chat:`。"
