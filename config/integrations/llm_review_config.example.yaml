# 公开示例：复制到 `local/integrations/llm_review_config.yaml` 后再对接真实网关。
# 本文件只描述请求/响应协议，不应出现真实令牌或真实内网地址。

provider: http-json

defaults:
  timeout_seconds: 30
  keep_threshold: 0.85
  review_threshold: 0.60

request:
  method: POST
  url: https://example-llm-gateway.local/review
  headers:
    Content-Type: application/json
    Authorization: "Bearer {api_key}"
  json_body:
    model: example-bio-reviewer
    input:
      title: "{title_en}"
      abstract: "{abstract}"
      journal: "{journal}"
      publication_stage: "{publication_stage}"
      category: "{category}"
      tags: "{tags_csv}"
      instructions: "返回 JSON，至少包含 decision、confidence、reason，可选 category_override。"
  response_json_path: output

response_fields:
  decision_path: decision
  confidence_path: confidence
  reason_path: reason
  category_override_path: category_override

secrets:
  api_key_env: LLM_REVIEW_API_KEY

notes:
  - 服务应返回一个 JSON 对象，至少包含 `decision`、`confidence`、`reason`。
  - 合法决策值为 `keep`、`review`、`reject`。
  - `category_override` 是可选字段，只有在规则分类明显不合适时才需要返回。
