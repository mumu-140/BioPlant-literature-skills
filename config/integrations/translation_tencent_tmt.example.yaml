# 公开示例：复制到 `local/integrations/translation_tencent_tmt.yaml` 后再填写真实凭证。
# 这里保留的是腾讯云官方 API 字段形状，不包含真实账号信息。

provider: tencent-tmt
glossary_path: ${SKILL_DIR}/config/content/bio_translation_glossary.yaml

tencent_tmt:
  endpoint: https://tmt.tencentcloudapi.com/
  host: tmt.tencentcloudapi.com
  service: tmt
  action: TextTranslate
  version: 2018-03-21
  region: ap-beijing
  project_id: 0
  source_lang: en
  target_lang: zh
  timeout_seconds: 20
  secret_id_env: TENCENT_TMT_SECRET_ID
  secret_key_env: TENCENT_TMT_SECRET_KEY
  token_env: ""

summary:
  mode: translated-abstract
  prefix_template: ""
  fallback_without_abstract: "未抓取到可用摘要，建议后续人工补充中文总结。"

notes:
  - 腾讯云 TextTranslate API 使用 SecretId + SecretKey；这条云 API 路径不需要 AppID。
  - 真实密钥只放环境变量，不要写进 YAML。
  - 如果使用临时凭证，请额外设置 `token_env` 对应的环境变量。
  - 建议配合生物学术语表做后处理，减少术语漂移。
