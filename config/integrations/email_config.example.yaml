# 公开示例：复制到 `local/integrations/email_config.yaml` 后再填写本机 SMTP 参数。
# 这里不应出现真实邮箱、授权码或真实收件人名单。

smtp_profiles:
  primary_smtp:
    # 是否启用该 profile；首次部署建议只启用一个。
    enabled: false
    smtp_host: smtp.example.com
    smtp_port: 465
    security: ssl
    username: your_account@example.com
    password_env: SMTP_APP_PASSWORD
    from_email: your_account@example.com
    from_name: Bio Literature Digest
    # 仅兜底使用。正常收件人应维护在 `local/integrations/users.yaml`。
    to_emails: []
    notes:
      - 使用邮箱授权码或 App Password，不要使用登录密码。
      - `password_env` 对应的真实值应只放在 `local/.env.local`。

  backup_smtp:
    enabled: false
    smtp_host: smtp-backup.example.com
    smtp_port: 465
    security: ssl
    username: your_backup_account@example.com
    password_env: SMTP_BACKUP_APP_PASSWORD
    from_email: your_backup_account@example.com
    from_name: Bio Literature Digest
    # 仅兜底使用。正常收件人应维护在 `local/integrations/users.yaml`。
    to_emails: []
    notes:
      - 可选备用发件通道；不用时保持 `enabled: false`。

delivery_defaults:
  timezone: Asia/Shanghai
  schedule_time: "08:00"
  subject_template: "[Bio Digest] {date} Daily Literature Update"
  attach_csv: true
  attach_xlsx: true
  attach_html_copy: false

notes:
  - 首次上线建议只启用一个 SMTP profile，避免误发。
  - 真实密钥不要写进 YAML，应通过环境变量注入。
  - 收件人名单以 `local/integrations/users.yaml` 为主，`to_emails` 只是兜底。
