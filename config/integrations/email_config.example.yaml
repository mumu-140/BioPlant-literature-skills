smtp_profiles:
  primary_smtp:
    enabled: false
    smtp_host: smtp.example.com
    smtp_port: 465
    security: ssl
    username: your_account@example.com
    password_env: SMTP_APP_PASSWORD
    from_email: your_account@example.com
    from_name: Bio Literature Digest
    to_emails:
      - recipient@example.com
    notes:
      - Use an SMTP authorization code or app password, not the login password.

  backup_smtp:
    enabled: false
    smtp_host: smtp-backup.example.com
    smtp_port: 465
    security: ssl
    username: your_backup_account@example.com
    password_env: SMTP_BACKUP_APP_PASSWORD
    from_email: your_backup_account@example.com
    from_name: Bio Literature Digest
    to_emails:
      - recipient@example.com
    notes:
      - Optional backup SMTP profile.

delivery_defaults:
  timezone: Asia/Shanghai
  schedule_time: "08:00"
  subject_template: "[Bio Digest] {date} Daily Literature Update"
  attach_csv: true
  attach_xlsx: true
  attach_html_copy: false

notes:
  - Enable only one SMTP profile for the initial deployment.
  - Keep real secrets out of the repository and load them from environment variables.
