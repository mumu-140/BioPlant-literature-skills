# 公开示例：复制到 `local/integrations/email_style.yaml` 后可按需覆盖默认样式。
# 邮件模板已内置现代化自适应排版，如无个性化定制需求留空即可继承默认精美样式。

base_css: |
  /* 桌面端 / 平板端自定义覆盖示例（可选） */
  /*
  .card-title {
    font-size: 16.5px;
  }
  */

mobile_css: |
  /* 移动端自定义覆盖示例（默认在 640px 以下生效，可选） */
  /*
  .card-title {
    font-size: 15px;
  }
  */

notes:
  - "修改 `base_css` 可调整桌面端和平板端邮件样式。"
  - "修改 `mobile_css` 可调整 640px 以下的移动端布局。"
  - "这里的内容会以原始 CSS 形式注入模板末尾，因此后写规则会覆盖前面的默认样式。"
  - "常用选择器包括：`.container`、`.hero`、`.group-summary`、`.card`、`.card-main`、`.card-title`、`.card-title-zh`、`.card-authors`、`.abstract-preview`、`.abstract-full`、`.card-footer`。"
