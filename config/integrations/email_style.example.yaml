# 公开示例：复制到 `local/integrations/email_style.yaml` 后再按品牌风格调整。
# 这里只包含模板末尾追加的 CSS，不包含任何账号或运行时敏感信息。

base_css: |
  /* 桌面端 / 平板端示例样式 */
  .hero h1 {
    font-size: 22px;
  }

  .card-title,
  .card-title-zh {
    font-size: 13px;
    line-height: 1.2;
  }

  .card-authors {
    font-size: 8px;
  }

  .container {
    padding: 0 4px;
  }

mobile_css: |
  /* 移动端示例样式（默认在 640px 以下生效） */
  .hero h1 {
    font-size: 19px;
  }

  .card-title,
  .card-title-zh {
    font-size: 12px;
  }

  .card-meta,
  .card-authors,
  .abstract-preview,
  .abstract-full,
  .card-footer {
    font-size: 7px;
  }

notes:
  - "修改 `base_css` 可调整桌面端和平板端邮件样式。"
  - "修改 `mobile_css` 可调整 640px 以下的移动端布局。"
  - "这里的内容会以原始 CSS 形式注入模板末尾，因此后写规则会覆盖前面的默认样式。"
  - "常用选择器包括：`.container`、`.hero`、`.group-summary`、`.card`、`.card-main`、`.card-title`、`.card-title-zh`、`.card-authors`、`.abstract-preview`、`.abstract-full`、`.card-footer`。"
